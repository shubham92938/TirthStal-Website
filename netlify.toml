[build]
  command = "npm run build"
  publish = "dist"

# API base used by the production build (a VITE_API_URL set in the Netlify
# dashboard takes precedence over this value).
[build.environment]
  VITE_API_URL = "https://backend-tirthsthal.onrender.com/api"

# Single-page app: serve index.html for client-side routes (/temples, /auth/login …)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
